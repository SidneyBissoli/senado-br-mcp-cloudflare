name: mcpscore (contrato de qualidade)

# O QUE ISTO GUARDA, e por que é contrato e não métrica.
#
# `mcpscore` é auditor determinístico (sem juiz LLM): conecta como cliente MCP
# real e verifica conformidade de protocolo, qualidade das tools, segurança/auth
# e prontidão para a spec 2026-07-28. É o ÚNICO dos quatro agregadores que mede
# o SERVIDOR RODANDO — mcpindex, Glama e LobeHub leem ficha e repositório.
# Por isso aqui ele deixa de ser número no painel e vira gate.
#
# CATRACA, não meta. O piso é o valor MEDIDO em 29/08/2026, arredondado para
# baixo: impede regressão sem prometer melhora. Ao subir a nota de verdade,
# suba o piso na mesma passada — senão a catraca protege um patamar que o
# servidor já não tem.
#
# HISTÓRICO DOS PISOS
#  - 29/08/2026: stdio 84%; remoto 93,4% -> pisos 84 e 93.
#  - 30/08/2026: migração para o SDK v2 mais os três achados que sobravam
#    (cursores de paginação, `title` no serverInfo, `server/discover`).
#    A MIGRAÇÃO SOZINHA mudou o DENOMINADOR remoto de 122 para 173: na v1 o
#    ciclo 2026-07-28 não existe, então o auditor pulava tudo que depende dele
#    e a nota de 93,4% media um universo menor. Produção em 173/173 -> piso 100.
#    No stdio houve um segundo achado: o `cli.ts` conectava o transporte à mão
#    (`server.connect`), o que atende só o ciclo legado. Medido: 127/144 com
#    `connect` direto e 146/148 com `serveStdio`, SEM UMA FALHA DE DIFERENÇA —
#    eram 17 pontos de regras que sequer eram avaliadas. Piso 98.
#
# DOIS PISOS, e a diferença não é arbitrária: no stdio várias regras de HTTP
# não se aplicam e o denominador muda, então a mesma implementação pontua
# diferente nos dois transportes. Medido aqui: stdio 121/144 = 84,0%; remoto 93,4%.
# Um piso único reprovaria o stdio no primeiro PR.
#
# O gate do PR mede o CÓDIGO DO PR (stdio, servidor local). O pós-deploy mede
# o que FOI AO AR. São perguntas diferentes e por isso são dois jobs.

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_run:
    workflows: ["Deploy to Cloudflare Workers"]
    types: [completed]
  # Semanal, porque o gatilho do deploy sozinho deixa um buraco: o
  # `deploy-worker.yml` é filtrado por caminho, então semana inteira sem tocar
  # em `src/` não audita nada. E o auditor não é estático — REGRA NOVA dele
  # também reprova, e isso é notícia, não ruído (é a razão de o piso ser 100).
  # Sem esta linha, uma regra nova só apareceria no deploy seguinte, que pode
  # demorar. Os seis repositórios rodam em horas diferentes, de propósito: uma
  # falha de infraestrutura da Cloudflare não deve chegar como seis alarmes
  # simultâneos parecendo seis defeitos.
  schedule:
    - cron: "17 11 * * 1"
  workflow_dispatch:

jobs:
  stdio:
    name: contrato no código do PR (stdio)
    # O eco do deploy não traz código novo para medir aqui — o PR e o push já
    # mediram este mesmo commit. Já o semanal ENTRA: o que muda sem commit é a
    # versão do auditor (o `uvx` não pina) e a árvore de dependências, e as
    # duas coisas mexem na nota. Rodar aqui é o que faz regra nova aparecer em
    # sete dias em vez de no próximo deploy.
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Build (o auditor precisa do bundle, não do fonte)
        run: npm run build
      - uses: astral-sh/setup-uv@v7
      - name: Auditar o servidor local
        run: uvx mcpscore --fail-under 98 --stdio node dist/cli.js

  remoto:
    name: contrato no que está no ar (streamable http)
    # Depois do deploy, nunca no PR: num PR o endpoint ainda serve o código
    # anterior, e reprovar o PR por isso mediria a coisa errada. E é o deploy
    # que dá o sinal, não o push: até 11/09/2026 os dois corriam em paralelo e
    # este job media a versão ANTERIOR, dando falha fantasma. O deploy só
    # conclui depois de conferir que /status já serve a versão do package.json.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Auditar o endpoint em produção
        run: uvx mcpscore --fail-under 100 https://senado.sidneybissoli.com/mcp
