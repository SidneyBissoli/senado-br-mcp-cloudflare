name: Contract tests (upstream shape drift)

# Weekly detection of upstream shape drift: refreshes the contract fixtures
# from the LIVE Senado APIs and runs the contract tier against them. A failure
# in the "live" step means the upstream changed the shape of a field some
# parser depends on — the worst silent-failure mode for a data tool.
#
# The tier is intentionally separate from `npm test` (unit suite stays
# network-free); see docs/contract-tests.pt-BR.md.

on:
  schedule:
    # Monday 03:20 America/Sao_Paulo (06:20 UTC). Nightly until 2026-10-27;
    # weekly since then (owner's decision), when the job moved to the
    # owner's desktop runner (see runs-on) with the other five servers.
    - cron: "20 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    # Runs on the owner's DESKTOP (self-hosted runner, label desktop-br), not
    # on GitHub-hosted runners: measured on 2026-10-27, the IBGE refuses
    # connections from outside Brazil (a Brazilian exit answers; US and German
    # exits fail to connect; the same US exit reaches the BCB), and GitHub's
    # runners sit in the US. Owner's decision: GitHub keeps scheduling,
    # retrying and annotating; only the execution moves to a machine in Brazil,
    # for all six servers with a live contract, not only the ibge.
    # Installed by portfolio-monitor/scripts/registrar-runners-desktop.ps1.
    # Desktop off: the job waits in the queue for up to 24 h and, if no runner
    # picks it up, ends without success — the panel flags it like a failure.
    runs-on: [self-hosted, desktop-br]
    # The runner is Windows; bash (from Git) keeps the `run:` steps' semantics.
    defaults:
      run:
        shell: bash
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Sanity: the tier must be green against the COMMITTED fixtures before
      # we talk to the live upstream — a failure here is a repo bug (test or
      # fixture out of sync), not drift.
      - name: Contract tests (committed fixtures)
        run: npm run test:contract

      # The Senado keeps a per-address blocklist and drops packets from the
      # addresses on it (measured 12/09/2026: 2 of 20 simultaneous runners got
      # no TCP answer at all from every Senado address, while 18 connected
      # normally and the same two fetched a control site in under 60 ms).
      # Recording which address this job drew is what makes a lost night
      # readable afterwards, and what would let us build a picture of the
      # blocklist over time.
      - name: Runner egress IP (diagnostic)
        run: |
          echo "egress=$(curl -s --max-time 15 https://api.ipify.org || echo indisponivel)"

      # Refresh every fixture from the live upstream (working tree only,
      # nothing is committed), then re-run the same assertions.
      #
      # OUTAGE IS NOT DRIFT, and the script says which is which: the reporter
      # (`@sbissoli/mcp-live-source`, since 3.21.2) writes the step summary and
      # the annotations the portfolio panel reads. Exit codes:
      #   0 — everything captured, OR the only failures are the source being
      #       down (5xx/timeout/network/429) with at least one capture answered:
      #       `::warning title=Fonte indisponível::<specs>`; those specs keep
      #       the committed fixture and the summary says drift was NOT measured
      #       there. Green on purpose — red would fire the auto-retry on a 502
      #       that persists (22/10/2026: three red runs for one endpoint).
      #   3 — nothing answered at all (breaker): `::error title=Fonte
      #       inalcançável::…`. Re-running draws another egress address.
      #   1 — a refused request (404/4xx), a body that is not the expected one
      #       after the retries, or a defect of ours: `::error` labelled
      #       `Deriva de formato` / `Ambíguo (deriva ou página de erro)` /
      #       `Falha alheia à origem`.
      - name: Refresh fixtures from live upstream
        run: npm run contract:refresh

      - name: Contract tests (live-refreshed fixtures)
        run: npm run test:contract

      # Visibility: show what changed shape-wise even when tests pass
      # (new/removed optional fields, reordered samples, etc.).
      - name: Fixture diff vs committed (informational)
        if: always()
        run: git --no-pager diff --stat -- tests/contract/fixtures || true
