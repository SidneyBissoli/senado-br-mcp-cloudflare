name: Contract tests (upstream shape drift)

# Nightly detection of upstream shape drift: refreshes the contract fixtures
# from the LIVE Senado APIs and runs the contract tier against them. A failure
# in the "live" step means the upstream changed the shape of a field some
# parser depends on — the worst silent-failure mode for a data tool.
#
# The tier is intentionally separate from `npm test` (unit suite stays
# network-free); see docs/contract-tests.pt-BR.md.

on:
  schedule:
    # 03:20 America/Sao_Paulo (06:20 UTC) every night
    - cron: "20 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Sanity: the tier must be green against the COMMITTED fixtures before
      # we talk to the live upstream — a failure here is a repo bug (test or
      # fixture out of sync), not drift.
      - name: Contract tests (committed fixtures)
        run: npm run test:contract

      # Recorded so a night that fails is diagnosable afterwards. The outages
      # this tier keeps hitting are all-or-nothing and intermittent, and the
      # leading hypothesis is the Senado dropping some cloud egress ranges for
      # a while — the same shape the e-Cidadania probe in this repo was built
      # to test. Without the address in the log there is nothing to correlate.
      - name: Runner egress IP (diagnostic)
        run: |
          echo "egress=$(curl -s --max-time 15 https://api.ipify.org || echo indisponivel)"

      # Refresh every fixture from the live upstream (working tree only,
      # nothing is committed), then re-run the same assertions.
      #
      # Exit 3 is the refresher's circuit breaker: the upstream never
      # answered, so drift was NOT measured tonight. That is a different fact
      # from drift and it is labelled as such here, because the portfolio
      # panel reads this job's conclusion and used to report an outage as
      # "a fonte mudou".
      - name: Refresh fixtures from live upstream
        run: |
          set +e
          npm run contract:refresh
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then
            {
              echo "### Upstream do Senado inalcançável"
              echo
              echo "Nenhuma captura respondeu; o disjuntor parou a rodada."
              echo "**A deriva de formato NÃO foi medida nesta noite** — isto não"
              echo "é deriva. Re-rodar o job cai em outro IP de saída."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Upstream inalcançável::deriva não medida; não é deriva de formato"
          fi
          exit $code

      - name: Contract tests (live-refreshed fixtures)
        run: npm run test:contract

      # Visibility: show what changed shape-wise even when tests pass
      # (new/removed optional fields, reordered samples, etc.).
      - name: Fixture diff vs committed (informational)
        if: always()
        run: git --no-pager diff --stat -- tests/contract/fixtures || true
