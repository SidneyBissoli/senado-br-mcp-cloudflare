name: CI

# Typecheck + test on every push and pull request to master.
# Guards the two things prepublishOnly runs locally (build/test) plus the
# full typecheck (src + ingest scripts), so a red PR is caught before merge.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel an in-flight run when a new commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Piso é node >= 22 (engines do package). O 20 saiu em 31/08/2026: fim
        # de vida em 30/04/2026, sem correção de segurança desde então.
        node-version: ["22", "24"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (src + ingest scripts)
        run: npm run typecheck

      - name: Test
        run: npm test

      # A superfície publicada é o produto: se o build não consegue nem levantar
      # o servidor e listar as tools, o pacote não deve passar no gate.
      - name: Dump da superfície (fumaça do build)
        run: |
          npm run build
          node scripts/dump-surface.mjs --stdio > /dev/null
