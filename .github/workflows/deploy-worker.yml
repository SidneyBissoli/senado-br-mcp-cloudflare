name: Deploy to Cloudflare Workers

# POR QUE ESTE WORKFLOW EXISTE
#
# O deploy do Worker era manual, e a deriva que isso produz foi MEDIDA em
# 29/08/2026: o npm estava em 3.5.1 e o endpoint hospedado em 3.5.0, deployado
# pela última vez em 24/08. O `publish.yml` publica no npm e no MCP Registry,
# mas nunca tocou no Worker — então toda release deixava produção para trás até
# alguém lembrar de rodar `wrangler deploy` na mão.
#
# Naquele caso o dano foi nulo por sorte: a 3.5.1 só mexeu em metadado
# (`icons` no server.json) e o `serverInfo.icons` já estava no ar desde antes.
# Da próxima vez pode ser código. É a mesma lição que bcb-br-mcp e ibge-br-mcp
# já pagaram — no bcb, npm 1.3.5 contra hospedado 1.3.1, servindo descrições de
# tool 12x menores em produção do que as do fonte.
#
# DIFERENÇAS DESTE REPOSITÓRIO em relação aos irmãos, e são elas que impedem
# copiar o arquivo deles sem ler:
#
#  - não há `worker/`: o repositório INTEIRO é o Worker (wrangler.toml na raiz,
#    src/index.ts como entrypoint), então não existe o passo "buildar a raiz
#    antes" que lá é obrigatório;
#  - o token de deploy é DEDICADO (`CLOUDFLARE_DEPLOY_TOKEN`, criado com o
#    template "Edit Cloudflare Workers"), separado do `CLOUDFLARE_API_TOKEN`
#    que as pipelines de e-Cidadania usam e do `CF_API_TOKEN` de analytics.
#    Apontar para o nome errado usaria um token com escopo que não deploya;
#  - o account id é VARIÁVEL de repositório (`vars`), não secret.
#
# Dois gatilhos:
#  - push em master nos caminhos que afetam o Worker;
#  - workflow_dispatch, para redeploy sem mudança de código.
#
# NÃO há risco de deploy duplo com o `ingest-estrutura.yml`, que também deploya
# ao atualizar o snapshot da árvore organizacional: o push dele é feito com o
# GITHUB_TOKEN, e o GitHub não dispara workflows a partir desses pushes.

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "wrangler.toml"
      - "surface.lock.json"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Sem o token, o job é PULADO em vez de falhar: master vermelho por
      # credencial ausente esconde falha de verdade. O deploy segue possível na
      # mão (`npx wrangler deploy` com login local).
      - name: Verificar credencial da Cloudflare
        id: cf
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}" ]; then
            echo "ok=true" >> $GITHUB_OUTPUT
          else
            echo "ok=false" >> $GITHUB_OUTPUT
            echo "::warning::CLOUDFLARE_DEPLOY_TOKEN ausente — deploy pulado. Cadastre o secret para ligar o deploy contínuo."
          fi

      - if: steps.cf.outputs.ok == 'true'
        uses: actions/checkout@v7

      # NODE 22 = o piso do projeto desde 31/08/2026 (`engines.node` ">=22").
      # Antes este pino era uma EXCEÇÃO ao piso de 20, porque o wrangler 4.x
      # recusa Node < 22 ("Wrangler requires at least Node.js v22.0.0") e o
      # deploy morria antes de autenticar — medido no senado-br-mcp-cloudflare
      # em 29/08/2026. A exceção virou a regra: não descer daqui.
      - if: steps.cf.outputs.ok == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - if: steps.cf.outputs.ok == 'true'
        name: Install
        run: npm ci

      # Não deployar o que não compila: o wrangler transpila na hora e um erro
      # de tipo chegaria a produção como erro de runtime.
      - if: steps.cf.outputs.ok == 'true'
        name: Typecheck
        run: npm run typecheck

      # O DEPLOY SE RECUSA A RODAR COM TESTE VERMELHO. Até 02/10/2026 este job
      # só checava tipos: o ci.yml roda em paralelo no mesmo push e não segura
      # nada. Entre os testes está a trava da superfície
      # (tests/surface-lock.test.ts): mudou sem subir a versão = vermelho aqui,
      # e o wrangler abaixo não roda.
      - if: steps.cf.outputs.ok == 'true'
        name: Testes — inclui a trava da superfície
        run: npm test

      - if: steps.cf.outputs.ok == 'true'
        name: Deploy via Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # A GUARDA QUE FALTAVA. O smoke abaixo exercita a superfície, mas passaria
      # igual servindo a versão ANTERIOR — foi assim que 3.5.0 ficou no ar sem
      # ninguém notar. Este passo compara o que /status reporta com o
      # package.json e falha se divergirem, que é a deriva por definição.
      #
      # REPETE por até 3 min (06/10/2026). Antes era UMA leitura após `sleep 20`, e o
      # Worker novo leva mais que isso para chegar à borda: no deploy da 3.15.1
      # (run 37515023242) a leitura dos 20 s viu 3.15.0, o job falhou e PULOU o smoke
      # e a conferência da superfície — um vermelho falso que ainda cegava as duas
      # provas seguintes; 3 min depois o endpoint já servia 3.15.1. O /status
      # responde `Cache-Control: no-store`, então o atraso é propagação, não cache.
      # Deriva de verdade (deploy que não subiu) continua falhando, só que após o
      # prazo, com a última versão vista.
      - if: steps.cf.outputs.ok == 'true'
        name: Versão hospedada bate com o package.json
        run: |
          ESPERADA=$(node -p "require('./package.json').version")
          PRAZO=180; INTERVALO=10; INICIO=$(date +%s); NO_AR="?"
          while :; do
            # Falha de rede ou JSON inválido não derruba o laço: vira "?" e tenta de novo.
            NO_AR=$(curl -sS --max-time 30 https://senado.sidneybissoli.com/status 2>/dev/null \
              | node -e "try{console.log(JSON.parse(require('fs').readFileSync(0,'utf8')).version)}catch{console.log('?')}" \
              || echo "?")
            DECORRIDO=$(( $(date +%s) - INICIO ))
            echo "t=${DECORRIDO}s  package.json=$ESPERADA  hospedado=$NO_AR"
            [ "$ESPERADA" = "$NO_AR" ] && exit 0
            if [ "$DECORRIDO" -ge "$PRAZO" ]; then
              echo "::error::deriva: após ${PRAZO}s o endpoint serve $NO_AR e o repositório está em $ESPERADA"
              exit 1
            fi
            sleep "$INTERVALO"
          done

      # Fecha o ciclo: se o deploy subir um Worker quebrado, o job falha aqui e
      # não em silêncio na próxima vez que alguém abrir o endpoint.
      - if: steps.cf.outputs.ok == 'true'
        name: Smoke em produção
        run: npm run smoke:openai-app

      # O que subiu é o que foi travado, nos DOIS perfis: superfície declarada
      # servida sem credencial e, método a método, quem responde sem token
      # (produção = API_KEY ausente). Os testes provam o CÓDIGO; isto prova o
      # ENDPOINT.
      - if: steps.cf.outputs.ok == 'true'
        name: Superfície no ar = surface.lock.json
        run: |
          npx mcp-surface verificar https://senado.sidneybissoli.com/mcp --perfil full --tool senado_estrutura_organizacional --args '{"unidade":"DGER"}'
          npx mcp-surface verificar https://senado.sidneybissoli.com/mcp/openai-app-v2 --perfil openai-app --rota "POST /mcp/openai-app-v2" --tool senado_estrutura_organizacional --args '{"unidade":"DGER"}'
