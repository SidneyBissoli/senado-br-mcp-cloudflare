name: Contract tests retry

# Re-runs a failed "Contract tests (upstream shape drift)" job on a fresh
# runner.
#
# Why this exists, MEASURED on 12/09/2026: the Senado silently drops packets
# from some source addresses, and a job that lands on one of them is lost.
#
# The experiment: 20 GitHub runners fired at the same instant against
# 201.54.48.132 (which serves BOTH legis.senado.leg.br and adm.senado.gov.br)
# and 201.54.48.99 (www12). 18 runners connected normally. Two —
# 20.64.173.130 and 52.154.19.227 — got no answer at all: raw TCP to port 443
# never completed, on every Senado address, with our User-Agent and with a
# plain `curl/8.5.0` alike, while the same two runners fetched a control site
# in under 60 ms. Neighbours inside the same Azure ranges connected fine, so
# this is a per-address blocklist and not a cloud range being refused.
#
# That is exactly what the bad nights look like from the inside: on 02, 04,
# 08 and 11/09 every single one of ~264 requests timed out — no RST, no DNS
# error, no HTTP status, and the FIRST request already dead, so nothing our
# run did caused it. Silence is the signature of a firewall DROP; a host that
# is down answers with a reset, and a host under load answers with 5xx.
#
# So the cure is a different source address, and nothing else. `gh run rerun
# --failed` re-runs only the jobs that failed, each landing on a fresh runner
# with a fresh address. At the 10% blocked measured above, three attempts put
# the odds of losing a night near one in a thousand.
#
# The wait is deliberately SHORT. An earlier version slept 10 min, which came
# from the hypothesis that the upstream was under load; the measurement above
# refuted that. Waiting does not un-block an address — only a new runner
# does. The minute that is left only keeps a systemic failure from spinning.

on:
  workflow_run:
    workflows: ["Contract tests (upstream shape drift)"]
    types: [completed]

permissions:
  actions: write # gh run rerun

jobs:
  rerun:
    # Deliberately NOT `!= 'success'`. A run someone cancelled by hand also
    # reports `cancelled`, and restarting it would override that person's
    # decision. Until now an outage showed up as `cancelled` too, because the
    # job ran into its own 30 min ceiling; with the refresher's breaker it
    # exits 3 and lands here as `failure`. `timed_out` stays as a backstop.
    if: >-
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out') &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait, then re-run the failed jobs on a new runner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          echo "run $RUN_ID did not succeed on attempt $ATTEMPT; waiting 60s"
          sleep 60
          # Belt to the job-level `if`. That guard reads the attempt out of
          # the event payload, and a GitHub expression coerces an absent
          # field to 0 — which would compare as "< 3" forever and turn a
          # genuine, reproducible failure into an endless retry loop. So ask
          # the API for the attempt the run is actually on, right before
          # firing, and refuse from the live number.
          live=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID" \
            --jq '.run_attempt')
          case "$live" in
            ''|*[!0-9]*)
              echo "could not read run_attempt (got '$live'); refusing" >&2
              exit 1
              ;;
          esac
          if [ "$live" -ge 3 ]; then
            echo "run $RUN_ID is already on attempt $live; giving up"
            exit 0
          fi
          gh run rerun "$RUN_ID" --failed -R "${{ github.repository }}"
          echo "re-run requested for the failed jobs of $RUN_ID"
